<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Clinic - Doctor Consultation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS Files -->
    <link rel="stylesheet" href="../css/mobile-first.css">
    <link rel="stylesheet" href="../css/desktop.css" media="screen and (min-width: 768px)">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="header-title">
            <h1>SMART CLINIC</h1>
            <p>Smart Healthcare for everyone</p>
        </div>

        <button class="menu-toggle">☰</button>
    </header>

    <!-- Navigation -->
    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a >My Appointments</a>
        <a >Queue Status</a>
        <a >Contact Us</a>
        <a >About</a>
        <a >Logout</a>
    </nav>


    <!-- Main Content -->
    <main>
        <section class="registration-section">

            <h2>Patient Registration</h2>
            <p class="welcome-text">Please fill in your details below.</p>

            <form id="registrationForm" autocomplete="off">

                <label>First Name</label>
                <input type="text" id="firstName" required>

                <label>Last Name</label>
                <input type="text" id="lastName" required>

                <label>Date of Birth</label>
                <input type="text" id="dob" placeholder="DD/MM/YYYY" required>

                <label>Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                    <option value="Other">Other</option>
                </select>

                <label>Address</label>
                <input type="text" id="address" required>

                <label>Contact Number</label>
                <input type="tel" id="contact" required>

                <label>Email Address</label>
                <input type="email" id="email" required>

                <button type="submit" class="register-submit-btn">Submit Registration</button>

            </form>

        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>Email: Smart_clinic@gmail.com</p>
        <p>Opening Hours: Monday - Friday, 9:00 am - 6:00 pm</p>
        <p>© 2026 Smart Clinic - Academic Project Prototype</p>
    </footer>

<!-- Alert message -->
    <script>
        document.getElementById("registrationForm").addEventListener("submit", function(event) {
            event.preventDefault();
            alert("Thank you for registering with Smart Clinic. Your information has been received. Our team will contact you soon to complete the process. After that you will be able to login to make appointments.");
        
         // Redirect after 20 seconds
        setTimeout(function() {
        window.location.href = "login.html";
        }, 2000); // 2000 milliseconds = 2 seconds
     });
   
    </script>

</body>
</html>
